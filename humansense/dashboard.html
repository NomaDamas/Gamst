<header><div class="brand">Catch Your Mind<span>.</span></div><div class="header-controls"><span id="statusPill" class="status-pill" data-active="false" role="status"><span id="status">수집 중지</span></span><label class="language-control"><span>화면 언어</span><select id="uiLanguage" aria-label="화면 언어"><option value="en">English</option><option value="ko">한국어</option><option value="zh">中文</option></select></label><button id="openSettings" aria-label="설정 열기" aria-haspopup="dialog">설정</button></div></header>

</div>

function setCameraRatio(value,persist=true){const width=workspace.getBoundingClientRect().width||1000;if(width<650){cameraRatio=Math.max(28,Math.min(65,Number.isFinite(value)?value:42));return}const min=Math.max(28,280/width*100),max=Math.min(65,(width-338)/width*100);cameraRatio=Math.max(min,Math.min(Math.max(min,max),Number.isFinite(value)?value:42));workspace.style.setProperty('--camera-ratio',cameraRatio+'%');splitter.setAttribute('aria-valuemin',String(Math.round(min)));splitter.setAttribute('aria-valuemax',String(Math.round(Math.max(min,max))));splitter.setAttribute('aria-valuenow',String(Math.round(cameraRatio)));splitter.setAttribute('aria-valuetext',Math.round(cameraRatio)+'%');if(persist)try{localStorage.setItem('cym.cameraRatio',String(cameraRatio))}catch{}}
let dragging=false;
splitter.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();dragging=true;splitter.setPointerCapture(e.pointerId);splitter.classList.add('dragging');document.body.classList.add('resizing')};
splitter.onpointermove=e=>{if(!dragging)return;const rect=workspace.getBoundingClientRect();setCameraRatio((e.clientX-rect.left)/rect.width*100)};
function endResize(){dragging=false;splitter.classList.remove('dragging');document.body.classList.remove('resizing')}
splitter.onpointerup=e=>{endResize();if(splitter.hasPointerCapture(e.pointerId))splitter.releasePointerCapture(e.pointerId)};splitter.onpointercancel=endResize;splitter.onlostpointercapture=endResize;
splitter.ondblclick=()=>setCameraRatio(42);splitter.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();setCameraRatio(e.key==='Home'?0:e.key==='End'?100:cameraRatio+(e.key==='ArrowRight'?2:-2))};

function setCaptureStatus(running){if(running)$('asrLanguage').disabled=true;for(const id of ['useVideo','useAudio'])$(id).disabled=running;$('statusPill').setAttribute('data-active',String(running));$('status').textContent=CymI18n.text(running?'관찰 중':'수집 중지')}

async function api(body){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','X-HumanSense-Token':token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);return d}
function error(e){$('error').textContent=CymI18n.text(e.message||String(e))}
const charts=new ContextCharts($('categoryCharts'),CymI18n.locale);
$('uiLanguage').value=CymI18n.locale;$('uiLanguage').onchange=()=>{CymI18n.set($('uiLanguage').value);if(['Ready','대기','就绪'].includes($('vlmTestResult').textContent))$('vlmTestResult').textContent=CymI18n.text('대기');charts.locale=CymI18n.locale;if(latestDashboard)render(latestDashboard)};
const gaugeDefs=[['smile','미소','점수'],['blink','눈 감김','점수'],['jaw','입 벌림','점수'],['brow','눈썹 올림','점수'],['rms','음량','RMS'],['speech','음성 활동','상태']];const histories={};
for(const [id,label,unit] of gaugeDefs){const el=document.createElement('div');el.className='gauge';el.innerHTML=`<div class="dial" role="meter" aria-label="${label}" aria-valuemin="0" aria-valuemax="100"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="42"/><circle id="arc-${id}" class="arc" cx="50" cy="50" r="42"/></svg><strong id="value-${id}">—</strong></div><small>${label} · ${unit}</small><svg class="spark" viewBox="0 0 120 28" preserveAspectRatio="none" aria-hidden="true"><polyline id="history-${id}" fill="none" stroke="#8c9cdd" stroke-width="1.5"/></svg>`;$('gauges').append(el);histories[id]=[]}
function gauge(id,value,stamp){const valid=Number.isFinite(value),normalized=valid?Math.max(0,Math.min(1,value)):0;$('arc-'+id).style.strokeDashoffset=264*(1-normalized);$('value-'+id).textContent=valid?(id==='rms'?value.toFixed(3):id==='speech'?(value?'ON':'OFF'):(value*100).toFixed(0)):'—';const meter=$('value-'+id).parentElement;if(valid)meter.setAttribute('aria-valuenow',normalized*100);else meter.removeAttribute('aria-valuenow');let h=histories[id];if(stamp!==h.at(-1)?.stamp){h.push({stamp,value:normalized});if(h.length>48)h.shift()}$('history-'+id).setAttribute('points',h.map((p,i)=>`${i*120/47},${26-p.value*24}`).join(' '))}
function display(value){if(value===null||value===undefined)return '—';if(typeof value==='number')return Number.isInteger(value)?String(value):value.toFixed(3);if(typeof value==='boolean')return value?'ON':'OFF';if(Array.isArray(value))return value.map(display).join(' · ');if(typeof value==='object')return Object.entries(value).map(([k,v])=>`${k}: ${display(v)}`).join(' / ');return String(value)}
const labels={'audio.rms':'음량 RMS','speech.activity':'음성 활동','scene.description':'VLM 장면','scene.window':'VLM 관찰 구간','scene.faces':'표정','text.utterance':'최근 발화','text.transcript':'음성 전사','speech.transcript':'음성 전사'};
function render(d){packet=d.context;renderSettings(d);drawGuides(d);$('asrLanguage').disabled=!d.asr?.available||!d.state.paused||asrBusy;if(!asrBusy)$('asrLanguage').value=d.asr?.language||'auto';const voice=d.context.observations?.['classification.voice_emotion'];const voiceLabels={neu:'중립',hap:'기쁨',ang:'분노',sad:'슬픔'};$('voiceEmotionSummary').textContent=voice?((d.state.paused||voice.fresh===false||(d.features||[]).some(f=>f.name==='classification.voice_emotion'&&!f.enabled))?'마지막 관측 · ':'')+Object.entries(voice.value.labels).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${voiceLabels[k]||k} ${v.toFixed(3)}`).join(' · '):(d.plugins?.includes('classification.voice_emotion')?'음성 입력 대기 · 3초 구간':'모델 미연결');$('voiceEmotionDetails').disabled=!voice;if($('showCharts').checked)charts.render(packet.observations||{},!d.state.paused);$('routing').textContent=Object.entries(d.routing||{}).map(([m,s])=>`${m} · ${s.processed} 처리 · ${s.dropped} 드롭 · ${s.queued}/${s.capacity} 큐`).join(' / ');const obs=packet.observations||{},signals=d.state.signals||{};const val=n=>obs[n]?.value;const faceObs=obs['scene.faces'];const faces=signals['scene.faces']?.observation.value||[];const shape=faceObs?.fresh?faces[0]?.blendshapes:null;const avg=(a,b)=>shape&&Number.isFinite(shape[a])&&Number.isFinite(shape[b])?(shape[a]+shape[b])/2:NaN;const stamp=faceObs?.timestamp_ms;gauge('smile',avg('mouthSmileLeft','mouthSmileRight'),stamp);gauge('blink',avg('eyeBlinkLeft','eyeBlinkRight'),stamp);gauge('jaw',shape?.jawOpen,stamp);gauge('brow',shape?.browInnerUp,stamp);gauge('rms',obs['audio.rms']?.fresh?val('audio.rms'):NaN,obs['audio.rms']?.timestamp_ms);gauge('speech',obs['speech.activity']?.fresh?Number(val('speech.activity')):NaN,obs['speech.activity']?.timestamp_ms);$('faces').textContent='얼굴 '+(faceObs?.fresh?faces.length:'—');
const rows=[];function row(name,value,o){const tr=document.createElement('tr');for(const [i,text] of [CymI18n.text(name),display(value),(o.age_ms/1000).toFixed(1)+'s',o.fresh?'LIVE':'STALE'].entries()){const td=document.createElement('td');td.textContent=text;td.className=i===1?'value':i===3?(o.fresh?'fresh':'stale'):'';tr.append(td)}rows.push(tr)}
for(const [name,o] of Object.entries(obs).sort(([a],[b])=>a.localeCompare(b))){if(name==='scene.faces'){for(const face of o.value||[])for(const [key,value] of Object.entries(face.blendshapes||{}))row(`얼굴 ${face.frame_face_index+1} · ${faceMovementTitle(key)}`,value,o)}else if(name==='scene.poses'){for(const pose of o.value||[]){const body=pose.track_id||`frame-${pose.frame_pose_index+1}`;row(`Body ${body} · landmarks`,pose.landmarks?.length||0,o);for(const [key,value] of Object.entries(pose.geometry||{}))row(`Body ${body} · ${key.replaceAll('_',' ')}`,value,o)}}else if(name==='scene.window'){const w=o.value;row('VLM 관찰 구간',`${w.actual_seconds?.toFixed(1)}s · ${w.frame_count} frames · ${w.actual_fps?.toFixed(2)} FPS`,o)}else row(labels[name]||observationTitle(name),o.value,o)}
if(!rows.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.className='empty';td.textContent='입력 대기';tr.append(td);rows.push(tr)}$('contextRows').replaceChildren(...rows);$('scene').textContent=val('scene.description')||'—';const w=val('scene.window');$('windowStats').textContent=w?`${w.frame_count} frames · ${w.actual_seconds.toFixed(1)}s · ${w.actual_fps.toFixed(2)} FPS · ${new Date(w.end_ms).toLocaleTimeString()}`:'—';
const v=d.vlm||{};if(!vlmDirty){$('vlmEnabled').checked=!!v.enabled;for(const key of ['interval','window_seconds','sample_fps'])if(v[key]!==undefined)$(key).value=v[key]}$('applyVlm').disabled=!v.available;$('vlmEnabled').disabled=!v.available;$('vlmStats').textContent=v.available?`${v.enabled?'ON':'OFF'} · 샘플 상한 ${v.effective_sample_fps.toFixed(2)} FPS · 버퍼 ${v.buffered_frames}/${v.max_frames}`:'모델 미연결';$('workers').textContent=(d.workers||[]).map(w=>`${w.name.replace('local_vlm_scene','VLM')} ${w.last_latency_ms===null?'—':Math.round(w.last_latency_ms)+'ms'} · 큐 ${w.queued} · 드롭 ${w.dropped}`).join(' / ');$('chat').disabled=!$('useCompanion').checked||!d.companion_available||chatBusy;$('modelStatus').textContent=d.companion_available?'연결됨':'미연결';if(d.adapter_errors?.length)error(d.adapter_errors.join('\n'));
if(d.state.paused&&active)release();setCaptureStatus(!d.state.paused);CymI18n.apply();}
async function connect(){streamController=new AbortController();try{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','X-HumanSense-Token':token},body:JSON.stringify({op:'stream'}),signal:streamController.signal});if(!r.ok)throw Error('스트림 연결 실패');$('connection').textContent='● LIVE CONTEXT · 4 Hz';const reader=r.body.getReader(),decoder=new TextDecoder();let rest='';while(true){const {value,done}=await reader.read();if(done)break;rest+=decoder.decode(value,{stream:true});let idx;while((idx=rest.indexOf('\n'))>=0){render(JSON.parse(rest.slice(0,idx)));rest=rest.slice(idx+1)}}}catch(e){if(e.name==='AbortError')return;$('connection').textContent='재연결 중'}setTimeout(connect,1500)}
function release(){active=false;$('cameraOverlay').replaceChildren();generation++;clearInterval(videoTimer);videoTimer=null;if(processor){processor.onaudioprocess=null;processor.disconnect();processor=null}if(source){source.disconnect();source=null}if(mute){mute.disconnect();mute=null}if(ctx){ctx.close();ctx=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;audioBuf=[];$('start').disabled=false;$('stop').disabled=true;setCaptureStatus(false)}
$('start').onclick=async()=>{if(!$('consent').checked)return error('처리 동의를 먼저 선택해 주세요.');$('error').textContent='';try{await api({op:'start',consent:true});active=true;const gen=++generation;$('start').disabled=true;$('stop').disabled=false;setCaptureStatus(true);const video=$('useVideo').checked,audio=$('useAudio').checked;if(!video&&!audio)return;try{stream=await navigator.mediaDevices.getUserMedia({video:video?{width:640,height:360}:false,audio})}catch(e){error('장치 접근 실패. 텍스트 입력은 가능합니다: '+e.message);return}if(!active||gen!==generation){stream.getTracks().forEach(t=>t.stop());return}$('video').srcObject=stream;if(video){const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;let busy=false;videoTimer=setInterval(async()=>{if(busy||!active||!$('video').videoWidth)return;busy=true;try{canvas.getContext('2d').drawImage($('video'),0,0,640,360);await api({op:'video',jpeg:canvas.toDataURL('image/jpeg',.65).split(',')[1]})}catch(e){error(e)}finally{busy=false}},250)}if(audio){ctx=new AudioContext();await ctx.resume();source=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(4096,1,1);mute=ctx.createGain();mute.gain.value=0;source.connect(processor);processor.connect(mute);mute.connect(ctx.destination);const rate=ctx.sampleRate;let sending=false;processor.onaudioprocess=e=>{if(!active||gen!==generation)return;audioBuf.push(...e.inputBuffer.getChannelData(0));if(audioBuf.length>rate*2){audioBuf=audioBuf.slice(-rate);error('처리 지연으로 오래된 오디오를 버렸습니다.')}if(audioBuf.length>=rate/2&&!sending){const block=audioBuf.splice(0,Math.floor(rate/2));const count=Math.floor(block.length*16000/rate),samples=new Array(count);for(let i=0;i<count;i++){const a=Math.floor(i*rate/16000),b=Math.min(block.length,Math.max(a+1,Math.floor((i+1)*rate/16000)));let v=0;for(let j=a;j<b;j++)v+=block[j];samples[i]=v/(b-a)}sending=true;api({op:'audio',samples,sample_rate:16000}).catch(error).finally(()=>sending=false)}}}}catch(e){release();await api({op:'stop'}).catch(()=>{});error(e)}};
$('consent').onchange=async()=>{if(!$('consent').checked&&active){release();try{await api({op:'stop'})}catch(e){error(e)}}};
$('stop').onclick=async()=>{release();try{await api({op:'stop'})}catch(e){error(e)}};
$('del').onclick=async()=>{release();try{await api({op:'stop'});await api({op:'delete'});charts.clear();$('reply').textContent='관찰 데이터를 삭제했습니다.'}catch(e){error(e)}};
async function submit(op,extra={}){if(!$('useCompanion').checked)return;try{const d=await api({op,text:$('text').value,...extra});if(d.assistant_text)$('reply').textContent=d.assistant_text;else $('text').value=''}catch(e){error(e)}}

for(const id of ['vlmEnabled','interval','window_seconds','sample_fps'])$(id).oninput=()=>{vlmDirty=true};

$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(packet,null,2));$('copy').textContent='복사됨';setTimeout(()=>$('copy').textContent='JSON 복사',1500)}catch(e){error(e)}};
const modelTitles={audio_level:'음량 · 에너지',opencv_hog_person:'사람 감지 · 영역 추적',mediapipe_pose_landmarker:'몸 자세 · 관절 움직임',mediapipe_face_landmarker:'얼굴 · 표정 움직임',faster_whisper:'음성 인식',silero_vad:'발화 감지','classification.voice_emotion':'목소리 감정',local_vlm_scene:'VLM 장면 분석'};
let settingsSignature='',latestDashboard=null;
function renderSettings(d){latestDashboard=d;const features=(d.features||[]).filter(f=>f.name!=='text_companion');$('useCompanion').checked=d.text_companion_enabled!==false;$('useCompanion').disabled=!d.state.paused;const signature=JSON.stringify(features.map(f=>f.name));if(signature!==settingsSignature){settingsSignature=signature;const rows=features.map(f=>{const label=document.createElement('div'),name=document.createElement('span'),input=document.createElement('button');label.className='model-setting';name.textContent=modelTitles[f.name]||f.name;input.type='button';input.className='toggle-button model-toggle';input.id='feature-'+f.name;input.textContent='ON / OFF';input.setAttribute('aria-label',modelTitles[f.name]||f.name);bindToggle(input,f.enabled);input.onchange=async()=>{input.disabled=true;try{await api({op:'configure_feature',name:f.name,enabled:input.checked})}catch(e){error(e)}};label.append(name,input);return label});$('featureSwitches').replaceChildren(...rows)}for(const f of features){const input=$('feature-'+f.name);input.checked=f.enabled;input.textContent=f.enabled?'ON':'OFF';input.disabled=!d.state.paused}$('testVlm').disabled=vlmTesting||!d.vlm?.available;$('gauges').hidden=!$('showGauges').checked;$('categoryCharts').hidden=!$('showCharts').checked;$('send').disabled=!$('useCompanion').checked;$('text').disabled=!$('useCompanion').checked;}
function drawGuides(d){const overlay=$('cameraOverlay');overlay.replaceChildren();if(d.state.paused||!$('video').videoWidth)return;const w=$('video').videoWidth,h=$('video').videoHeight;overlay.setAttribute('viewBox',`0 0 ${w} ${h}`);const make=(tag,attrs)=>{const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [key,value] of Object.entries(attrs))n.setAttribute(key,String(value));overlay.append(n);return n};const observations=d.context.observations||{};const face=observations['scene.faces'];if($('faceGuide').checked&&face?.fresh&&(d.features||[]).find(f=>f.name==='mediapipe_face_landmarker')?.enabled!==false){for(const [i,f] of face.value.entries()){const color=['#65e6cf','#b7a0ff','#ffd078','#ff9fa6'][i%4];for(const p of f.landmarks||[])if(Number.isFinite(p.x)&&Number.isFinite(p.y))make('circle',{cx:p.x*w,cy:p.y*h,r:1.3,fill:color});}}
const poses=observations['scene.poses'];if($('bodyGuide').checked&&poses?.fresh&&(d.features||[]).find(f=>f.name==='mediapipe_pose_landmarker')?.enabled!==false){const links=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,29],[29,31],[28,30],[30,32]];for(const pose of poses.value){const points=pose.landmarks||[];const visible=p=>p&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&(p.visibility??0)>=.5&&(p.presence??1)>=.5;for(const [a,b] of links)if(visible(points[a])&&visible(points[b]))make('line',{x1:points[a].x*w,y1:points[a].y*h,x2:points[b].x*w,y2:points[b].y*h,stroke:'#b7a0ff','stroke-width':2});for(const p of points)if(visible(p))make('circle',{cx:p.x*w,cy:p.y*h,r:3,fill:'#b7a0ff'});}}
const tracks=observations['scene.person_tracks'];if($('personGuide').checked&&tracks?.fresh&&(d.features||[]).find(f=>f.name==='opencv_hog_person')?.enabled!==false){for(const track of tracks.value){if(!track.visible)continue;const b=track.bbox;make('rect',{x:b.x*w,y:b.y*h,width:b.width*w,height:b.height*h,fill:'none',stroke:track.association_quality==='uncertain'?'#ffd078':'#65e6cf','stroke-width':2});const label=make('text',{x:b.x*w+4,y:Math.max(14,b.y*h+14),fill:'#65e6cf','font-size':12});label.textContent=track.track_id.split(':').at(-1)+(track.association_quality==='uncertain'?' ?':'');}}}
for(const id of ['faceGuide','bodyGuide','personGuide','showGauges','showCharts']){try{const saved=localStorage.getItem('cym.'+id);if(saved!==null)$(id).checked=saved==='true'}catch{}$(id).onchange=()=>{try{localStorage.setItem('cym.'+id,String($(id).checked))}catch{}if(latestDashboard){renderSettings(latestDashboard);drawGuides(latestDashboard)}if(id==='useCompanion')$('chat').disabled=!$(id).checked};}
