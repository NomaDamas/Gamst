<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catch Your Mind · Live</title>
<style>
:root{color-scheme:light;--bg:#fbfbfd;--ink:#1d1d1f;--muted:#747480;--line:#e7e7ed;--accent:#516bd1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}button,input,select{font:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:24px;padding:9px 16px;color:var(--ink)}button.primary{background:var(--ink);color:white}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:3px solid #516bd177;outline-offset:3px}header{padding:20px 32px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:750;letter-spacing:-.8px}.brand span{color:#8c81cd}main{max-width:1440px;margin:auto;padding:24px}.row,.toolbar,.checks{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.row{justify-content:space-between}h2{font-size:15px;margin:0}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px}.toolbar{margin-bottom:20px}.toolbar .checks{margin-right:auto}.muted,.badge,small{color:var(--muted);font-size:12px}.badge{background:#f4f4f8;border-radius:20px;padding:5px 10px}.dot{display:inline-block;width:8px;height:8px;background:#a3a3ad;border-radius:50%;margin-right:7px}.dot.live{background:#31a375}.grid{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(400px,1.4fr);gap:18px}.video-wrap{position:relative;background:#f2f2f6;aspect-ratio:16/9;overflow:hidden;border-radius:15px;display:grid;place-items:center;margin-top:16px}.video-wrap video{position:absolute;width:100%;height:100%;object-fit:cover}.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.gauge{text-align:center;min-width:0}.dial{position:relative;max-width:132px;margin:auto}.dial svg{display:block;width:100%;transform:rotate(-90deg)}.dial circle{fill:none;stroke-width:7}.track{stroke:#f0f0f5}.arc{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset .2s}.dial strong{position:absolute;inset:0;display:grid;place-items:center;font-size:23px;font-variant-numeric:tabular-nums}.gauge small{display:block}.spark{display:block;width:100%;height:28px;margin-top:4px}.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.settings label{font-size:12px;color:var(--muted)}input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:6px}input[type=checkbox]{accent-color:var(--accent)}.table-wrap{overflow:auto;max-height:660px;margin-top:15px}table{border-collapse:collapse;width:100%;font-size:12px;table-layout:fixed}th{text-align:left;color:var(--muted);font-weight:500;background:#fff;position:sticky;top:0}th,td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}th:first-child{width:29%}th:nth-child(3){width:16%}th:last-child{width:15%}td.value{font-variant-numeric:tabular-nums}.stale{color:#9a9aa4}.fresh{color:#238059}.empty{text-align:center;color:var(--muted);padding:40px}.error{color:#b43e34;white-space:pre-wrap;font-size:12px}.inputbar{display:flex;gap:8px;margin-top:16px}.inputbar input{min-width:0;flex:1;background:#f7f7fa;border:1px solid var(--line);border-radius:12px;padding:12px}.reply{margin-top:12px;white-space:pre-wrap}.workers{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;font-size:11px;color:var(--muted)}footer{font-size:11px;color:var(--muted);padding:4px 2px}.settings button{grid-column:1/-1}.live-summary{min-height:44px;margin:16px 0 0;font-size:14px}.observed{font-size:11px;color:var(--muted);margin-top:8px}@media(max-width:850px){.grid{grid-template-columns:1fr}main{padding:14px}header{padding:18px}.panel{padding:17px}.toolbar{gap:8px}th:first-child{width:26%}th:nth-child(3){width:17%}.gauges{gap:8px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="brand">Catch Your Mind<span>.</span></div><span><span id="liveDot" class="dot"></span><span id="status" class="muted">수집 중지</span></span></header>
<main><div class="toolbar"><div class="checks"><label><input id="useVideo" type="checkbox" checked> 카메라</label><label><input id="useAudio" type="checkbox" checked> 마이크</label><label><input id="consent" type="checkbox"> 로컬 처리 동의</label></div><button id="start" class="primary">시작</button><button id="stop" disabled>정지</button><button id="del">기록 지우기</button></div><div id="error" class="error" role="alert"></div>
<div class="grid"><section><div class="panel"><div class="row"><h2>Observability</h2><span id="faces" class="badge">얼굴 —</span></div><div class="video-wrap"><span class="muted">CAMERA</span><video id="video" autoplay muted playsinline></video></div><div id="gauges" class="gauges"></div><div class="workers" id="workers"></div><div class="workers" id="routing"></div></div><div class="panel"><h2>카테고리 · 시계열</h2><div id="categoryCharts"></div></div>
<div class="panel"><div class="row"><h2>VLM</h2><label><input id="vlmEnabled" type="checkbox"> ON</label></div><div class="settings"><label>분석 주기 · 초<input id="interval" type="number" min="1" max="60" step="1" value="3"></label><label>관찰 구간 · 초<input id="window_seconds" type="number" min="1" max="30" step="1" value="4"></label><label>샘플 · FPS<input id="sample_fps" type="number" min="0.2" max="4" step="0.1" value="2"></label><button id="applyVlm">설정 적용</button></div><div id="vlmStats" class="observed">—</div><p id="scene" class="live-summary">—</p><div id="windowStats" class="observed">—</div></div></section>
<section><div class="panel"><div class="row"><h2>전달되는 문맥</h2><div class="row"><span id="connection" class="badge">연결 중</span><button id="copy">JSON 복사</button></div></div><div class="table-wrap"><table><thead><tr><th scope="col">항목</th><th scope="col">값</th><th scope="col">경과</th><th scope="col">상태</th></tr></thead><tbody id="contextRows"><tr><td colspan="4" class="empty">입력 대기</td></tr></tbody></table></div></div><div class="panel"><div class="row"><h2>텍스트 · Companion</h2><span id="modelStatus" class="badge">—</span></div><div class="inputbar"><input id="text" type="text" aria-label="텍스트" placeholder="텍스트 입력"><button id="send">기록</button><button id="chat" class="primary" disabled>대화</button></div><div id="reply" class="reply" aria-live="polite"></div></div></section></div><footer>MCP · ws://127.0.0.1:8765</footer></main>
<script src="/observability.js"></script>
<script>
const token='__SESSION_TOKEN__';const $=id=>document.getElementById(id);let active=false,stream=null,ctx=null,processor=null,source=null,mute=null,videoTimer=null,audioBuf=[],generation=0,packet={},streamController=null,chatBusy=false,vlmDirty=false;
async function api(body){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','X-HumanSense-Token':token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);return d}
function error(e){$('error').textContent=e.message||String(e)}
const charts=new ContextCharts($('categoryCharts'));
const gaugeDefs=[['smile','미소','점수'],['blink','눈 감김','점수'],['jaw','입 벌림','점수'],['brow','눈썹 올림','점수'],['rms','음량','RMS'],['speech','음성 활동','상태']];const histories={};
for(const [id,label,unit] of gaugeDefs){const el=document.createElement('div');el.className='gauge';el.innerHTML=`<div class="dial" role="meter" aria-label="${label}" aria-valuemin="0" aria-valuemax="100"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="42"/><circle id="arc-${id}" class="arc" cx="50" cy="50" r="42"/></svg><strong id="value-${id}">—</strong></div><small>${label} · ${unit}</small><svg class="spark" viewBox="0 0 120 28" preserveAspectRatio="none" aria-hidden="true"><polyline id="history-${id}" fill="none" stroke="#8c9cdd" stroke-width="1.5"/></svg>`;$('gauges').append(el);histories[id]=[]}
function gauge(id,value,stamp){const valid=Number.isFinite(value),normalized=valid?Math.max(0,Math.min(1,value)):0;$('arc-'+id).style.strokeDashoffset=264*(1-normalized);$('value-'+id).textContent=valid?(id==='rms'?value.toFixed(3):id==='speech'?(value?'ON':'OFF'):(value*100).toFixed(0)):'—';const meter=$('value-'+id).parentElement;if(valid)meter.setAttribute('aria-valuenow',normalized*100);else meter.removeAttribute('aria-valuenow');let h=histories[id];if(stamp!==h.at(-1)?.stamp){h.push({stamp,value:normalized});if(h.length>48)h.shift()}$('history-'+id).setAttribute('points',h.map((p,i)=>`${i*120/47},${26-p.value*24}`).join(' '))}
function display(value){if(value===null||value===undefined)return '—';if(typeof value==='number')return Number.isInteger(value)?String(value):value.toFixed(3);if(typeof value==='boolean')return value?'ON':'OFF';if(Array.isArray(value))return value.map(display).join(' · ');if(typeof value==='object')return Object.entries(value).map(([k,v])=>`${k}: ${display(v)}`).join(' / ');return String(value)}
const labels={'audio.rms':'음량 RMS','speech.activity':'음성 활동','scene.description':'VLM 장면','scene.window':'VLM 관찰 구간','scene.faces':'표정','text.utterance':'최근 발화','text.transcript':'음성 전사','speech.transcript':'음성 전사'};
function render(d){packet=d.context;charts.render(packet.observations||{},!d.state.paused);$('routing').textContent=Object.entries(d.routing||{}).map(([m,s])=>`${m} · ${s.processed} 처리 · ${s.dropped} 드롭 · ${s.queued}/${s.capacity} 큐`).join(' / ');const obs=packet.observations||{},signals=d.state.signals||{};const val=n=>obs[n]?.value;const faceObs=obs['scene.faces'];const faces=signals['scene.faces']?.observation.value||[];const shape=faceObs?.fresh?faces[0]?.blendshapes:null;const avg=(a,b)=>shape&&Number.isFinite(shape[a])&&Number.isFinite(shape[b])?(shape[a]+shape[b])/2:NaN;const stamp=faceObs?.timestamp_ms;gauge('smile',avg('mouthSmileLeft','mouthSmileRight'),stamp);gauge('blink',avg('eyeBlinkLeft','eyeBlinkRight'),stamp);gauge('jaw',shape?.jawOpen,stamp);gauge('brow',shape?.browInnerUp,stamp);gauge('rms',obs['audio.rms']?.fresh?val('audio.rms'):NaN,obs['audio.rms']?.timestamp_ms);gauge('speech',obs['speech.activity']?.fresh?Number(val('speech.activity')):NaN,obs['speech.activity']?.timestamp_ms);$('faces').textContent='얼굴 '+(faceObs?.fresh?faces.length:'—');
const rows=[];function row(name,value,o){const tr=document.createElement('tr');for(const [i,text] of [name,display(value),(o.age_ms/1000).toFixed(1)+'s',o.fresh?'LIVE':'STALE'].entries()){const td=document.createElement('td');td.textContent=text;td.className=i===1?'value':i===3?(o.fresh?'fresh':'stale'):'';tr.append(td)}rows.push(tr)}
for(const [name,o] of Object.entries(obs).sort(([a],[b])=>a.localeCompare(b))){if(name==='scene.faces'){for(const face of o.value||[])for(const [key,value] of Object.entries(face.blendshapes||{}))row(`표정 ${face.frame_face_index} · ${key}`,value,o)}else if(name==='scene.window'){const w=o.value;row('VLM 관찰 구간',`${w.actual_seconds?.toFixed(1)}s · ${w.frame_count} frames · ${w.actual_fps?.toFixed(2)} FPS`,o)}else row(labels[name]||name,o.value,o)}
if(!rows.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.className='empty';td.textContent='입력 대기';tr.append(td);rows.push(tr)}$('contextRows').replaceChildren(...rows);$('scene').textContent=val('scene.description')||'—';const w=val('scene.window');$('windowStats').textContent=w?`${w.frame_count} frames · ${w.actual_seconds.toFixed(1)}s · ${w.actual_fps.toFixed(2)} FPS · ${new Date(w.end_ms).toLocaleTimeString()}`:'—';
const v=d.vlm||{};if(!vlmDirty){$('vlmEnabled').checked=!!v.enabled;for(const key of ['interval','window_seconds','sample_fps'])if(v[key]!==undefined)$(key).value=v[key]}$('applyVlm').disabled=!v.available;$('vlmEnabled').disabled=!v.available;$('vlmStats').textContent=v.available?`${v.enabled?'ON':'OFF'} · 샘플 상한 ${v.effective_sample_fps.toFixed(2)} FPS · 버퍼 ${v.buffered_frames}/${v.max_frames}`:'모델 미연결';$('workers').textContent=(d.workers||[]).map(w=>`${w.name.replace('local_vlm_scene','VLM')} ${w.last_latency_ms===null?'—':Math.round(w.last_latency_ms)+'ms'} · 큐 ${w.queued} · 드롭 ${w.dropped}`).join(' / ');$('chat').disabled=!d.companion_available||chatBusy;$('modelStatus').textContent=d.companion_available?'연결됨':'미연결';if(d.adapter_errors?.length)error(d.adapter_errors.join('\n'));
if(d.state.paused&&active)release();}
async function connect(){streamController=new AbortController();try{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','X-HumanSense-Token':token},body:JSON.stringify({op:'stream'}),signal:streamController.signal});if(!r.ok)throw Error('스트림 연결 실패');$('connection').textContent='● LIVE CONTEXT · 4 Hz';const reader=r.body.getReader(),decoder=new TextDecoder();let rest='';while(true){const {value,done}=await reader.read();if(done)break;rest+=decoder.decode(value,{stream:true});let idx;while((idx=rest.indexOf('\n'))>=0){render(JSON.parse(rest.slice(0,idx)));rest=rest.slice(idx+1)}}}catch(e){if(e.name==='AbortError')return;$('connection').textContent='재연결 중'}setTimeout(connect,1500)}
function release(){active=false;generation++;clearInterval(videoTimer);videoTimer=null;if(processor){processor.onaudioprocess=null;processor.disconnect();processor=null}if(source){source.disconnect();source=null}if(mute){mute.disconnect();mute=null}if(ctx){ctx.close();ctx=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;audioBuf=[];$('start').disabled=false;$('stop').disabled=true;$('status').textContent='수집 중지';$('liveDot').classList.remove('live')}
$('start').onclick=async()=>{if(!$('consent').checked)return error('처리 동의를 먼저 선택해 주세요.');$('error').textContent='';try{await api({op:'start',consent:true});active=true;const gen=++generation;$('start').disabled=true;$('stop').disabled=false;$('status').textContent='관찰 중';$('liveDot').classList.add('live');const video=$('useVideo').checked,audio=$('useAudio').checked;if(!video&&!audio)return;try{stream=await navigator.mediaDevices.getUserMedia({video:video?{width:640,height:360}:false,audio})}catch(e){error('장치 접근 실패. 텍스트 입력은 가능합니다: '+e.message);return}if(!active||gen!==generation){stream.getTracks().forEach(t=>t.stop());return}$('video').srcObject=stream;if(video){const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;let busy=false;videoTimer=setInterval(async()=>{if(busy||!active||!$('video').videoWidth)return;busy=true;try{canvas.getContext('2d').drawImage($('video'),0,0,640,360);await api({op:'video',jpeg:canvas.toDataURL('image/jpeg',.65).split(',')[1]})}catch(e){error(e)}finally{busy=false}},250)}if(audio){ctx=new AudioContext();await ctx.resume();source=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(4096,1,1);mute=ctx.createGain();mute.gain.value=0;source.connect(processor);processor.connect(mute);mute.connect(ctx.destination);const rate=ctx.sampleRate;let sending=false;processor.onaudioprocess=e=>{if(!active||gen!==generation)return;audioBuf.push(...e.inputBuffer.getChannelData(0));if(audioBuf.length>rate*2){audioBuf=audioBuf.slice(-rate);error('처리 지연으로 오래된 오디오를 버렸습니다.')}if(audioBuf.length>=rate/2&&!sending){const block=audioBuf.splice(0,Math.floor(rate/2));const count=Math.floor(block.length*16000/rate),samples=new Array(count);for(let i=0;i<count;i++){const a=Math.floor(i*rate/16000),b=Math.min(block.length,Math.max(a+1,Math.floor((i+1)*rate/16000)));let v=0;for(let j=a;j<b;j++)v+=block[j];samples[i]=v/(b-a)}sending=true;api({op:'audio',samples,sample_rate:16000}).catch(error).finally(()=>sending=false)}}}}catch(e){release();await api({op:'stop'}).catch(()=>{});error(e)}};
$('stop').onclick=async()=>{release();try{await api({op:'stop'})}catch(e){error(e)}};
$('del').onclick=async()=>{release();try{await api({op:'stop'});await api({op:'delete'});charts.clear();$('reply').textContent='관찰 데이터를 삭제했습니다.'}catch(e){error(e)}};
async function submit(op,extra={}){try{const d=await api({op,text:$('text').value,...extra});if(d.assistant_text)$('reply').textContent=d.assistant_text;else $('text').value=''}catch(e){error(e)}}

for(const id of ['vlmEnabled','interval','window_seconds','sample_fps'])$(id).oninput=()=>{vlmDirty=true};
async function applyVlm(){try{await api({op:'configure_vlm',enabled:$('vlmEnabled').checked,interval:Number($('interval').value),window_seconds:Number($('window_seconds').value),sample_fps:Number($('sample_fps').value)});vlmDirty=false;$('error').textContent=''}catch(e){error(e)}};
$('applyVlm').onclick=applyVlm;$('vlmEnabled').onchange=applyVlm;
$('send').onclick=()=>submit('text');$('chat').onclick=async()=>{chatBusy=true;$('chat').disabled=true;$('reply').textContent='…';await submit('chat');chatBusy=false};$('text').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)submit('text')};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(packet,null,2));$('copy').textContent='복사됨';setTimeout(()=>$('copy').textContent='JSON 복사',1500)}catch(e){error(e)}};
window.addEventListener('pagehide',()=>{release();streamController?.abort();fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','X-HumanSense-Token':token},body:JSON.stringify({op:'stop'}),keepalive:true}).catch(()=>{})});connect();
</script></body></html>
