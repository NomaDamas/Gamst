name: core
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m humansense demo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/dashboard_ui_test.cjs
  motion-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[vision]'
      - run: python -c "import cv2, numpy; print(cv2.__version__, numpy.__version__)"
      - run: python -m unittest discover -s tests -p test_motion_provider.py -v
      - run: python -m unittest discover -s tests -p test_prosody_provider.py -v
      - run: python -m unittest discover -s tests -p test_detection_provider.py -v
