name: core
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m humansense demo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/dashboard_ui_test.cjs
  motion-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[vision,websocket]'
      - run: python -c "import cv2, numpy; print(cv2.__version__, numpy.__version__)"
      - run: python -m unittest discover -s tests -p test_motion_provider.py -v
      - run: python -m unittest discover -s tests -p test_openeb.py -v
      - run: python -m unittest discover -s tests -p test_openeb_process.py -v
      - run: python -m unittest discover -s tests -p test_prosody_provider.py -v
      - run: python -m unittest discover -s tests -p 'test_direction*.py' -v
      - run: python -m unittest discover -s tests -p test_beamforming.py -v
      - run: python -m unittest discover -s tests -p test_duplex.py -v
      - run: python -m unittest discover -s tests -p test_piv.py -v
      - run: python -m unittest discover -s tests -p test_fill.py -v
      - run: python -m unittest discover -s tests -p test_vocal_expression.py -v
      - run: python -m unittest discover -s tests -p test_speaking_rate.py -v
      - run: python -m unittest discover -s tests -p test_diarization.py -v
      - run: python -m unittest discover -s tests -p test_audiovisual.py -v
      - run: python -m pip install "scipy>=1.10"
      - run: python -m unittest discover -s tests -p test_visual_microphone.py -v
      - run: python -m unittest discover -s tests -p test_visual_microphone_context.py -v
      - run: python -m unittest discover -s tests -p test_talknet.py -v
      - run: python -m unittest discover -s tests -p test_yoloe.py -v
      - run: python -m unittest discover -s tests -p test_srp_direction.py -v
      - run: python -m unittest discover -s tests -p 'test_qwen*.py' -v
      - run: python -m unittest discover -s tests -p test_body_context.py -v
      - run: python -m unittest discover -s tests -p test_hand_context.py -v
      - run: python -m unittest discover -s tests -p test_face_context.py -v
      - run: python -m unittest discover -s tests -p test_gaze.py -v
      - run: python -m unittest discover -s tests -p test_depth.py -v
      - run: python -m unittest discover -s tests -p test_ocr.py -v
      - run: python -m unittest discover -s tests -p test_visual_retrieval.py -v
      - run: python -m unittest discover -s tests -p test_region_appearance.py -v
      - run: python -m unittest discover -s tests -p test_landmarker_video.py -v
      - run: python -m unittest discover -s tests -p test_detection_provider.py -v
      - run: python -m unittest discover -s tests -p test_process_provider.py -v
      - run: python -m unittest discover -s tests -p test_environment_audio.py -v
      - run: python -m unittest discover -s tests -p test_perception_api.py -v
      - run: python -m pip install 'Pillow>=10'
      - run: python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p test_efficienttam_stream.py -v
      - run: python -m unittest discover -s tests -p test_efficienttam_context.py -v
      - run: python -m unittest discover -s tests -p test_efficientphys_native.py -v
      - run: python -m unittest discover -s tests -p test_efficientphys_context.py -v
