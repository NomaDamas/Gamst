[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humansense-sdk"
version = "0.3.1"
description = "gamst: local-first real-time sensory context for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "gamst contributors"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Development Status :: 3 - Alpha"]

[project.optional-dependencies]
vision = ["opencv-python>=4.8,<5", "numpy>=1.24"]
audio = ["sounddevice>=0.4,<1", "numpy>=1.24"]
vad = ["torch>=2.2,<3"]
asr = ["faster-whisper>=1.0,<2"]
mediapipe = ["mediapipe>=0.10,<0.11"]
huggingface = ["transformers>=4.45,<5", "torch>=2.2,<3", "Pillow>=10", "numpy>=1.24"]
providers = ["httpx>=0.27,<1"]
detection = ["rfdetr==1.12.1"]
environment-audio = ["mediapipe==0.10.35", "numpy>=1.24"]
websocket = ["websockets>=13,<16"]
gaze = ["torch==2.8.0", "torchvision==0.23.0", "mediapipe==0.10.35", "opencv-python>=4.8,<5", "numpy>=1.24", "Pillow>=10"]

depth = ["transformers==4.57.6", "torch==2.8.0", "huggingface-hub>=0.34,<1", "safetensors>=0.4.3,<1", "numpy>=1.24", "Pillow>=10"]

ocr = ["rapidocr==3.10.0", "onnxruntime==1.23.2"]

retrieval = ["transformers==4.57.6", "torch==2.8.0", "torchvision==0.23.0", "huggingface-hub>=0.34,<1", "safetensors>=0.4.3,<1", "numpy>=1.24", "Pillow>=10"]

duplex = ["pywebrtc-audio==0.2.0", "numpy>=1.24"]

[project.scripts]
gamst = "humansense.cli:main"
gamst-serve = "humansense.server:main"
gamst-mcp = "humansense.mcp:main"
gamst-mcp-live = "humansense.mcp_live:main"
gamst-dashboard = "humansense.dashboard:main"
humansense = "humansense.cli:main"
humansense-serve = "humansense.server:main"
humansense-mcp = "humansense.mcp:main"
humansense-mcp-live = "humansense.mcp_live:main"
humansense-dashboard = "humansense.dashboard:main"

[project.urls]
Repository = "https://github.com/NomaDamas/Gamst"

[tool.setuptools.packages.find]
include = ["humansense*"]

[tool.setuptools.package-data]
humansense = ["dashboard.html", "observability.js", "i18n.js"]
